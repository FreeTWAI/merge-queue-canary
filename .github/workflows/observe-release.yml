# Mirrors what a workflow_run-triggered release admission sees for a completed main-push run.
name: Observe release trigger
on:
  workflow_run:
    workflows: [Verify local milestone, CodeQL advanced setup]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record allowlisted workflow_run fields (no emails)
        env:
          WR_NAME: ${{ github.event.workflow_run.name }}
          WR_EVENT: ${{ github.event.workflow_run.event }}
          WR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WR_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WR_ACTOR: ${{ github.event.workflow_run.actor.login }}
          WR_ACTOR_ID: ${{ github.event.workflow_run.actor.id }}
          WR_TRIGGERING_ACTOR: ${{ github.event.workflow_run.triggering_actor.login }}
          WR_TRIGGERING_ACTOR_ID: ${{ github.event.workflow_run.triggering_actor.id }}
          RUN_ACTOR: ${{ github.actor }}
          RUN_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          BOT_EXCLUDED: ${{ github.event.workflow_run.actor.login == 'github-merge-queue[bot]' && github.event.workflow_run.actor.id == 118344674 }}
        run: |
          for k in WR_NAME WR_EVENT WR_HEAD_SHA WR_HEAD_BRANCH WR_CONCLUSION WR_ACTOR WR_ACTOR_ID WR_TRIGGERING_ACTOR WR_TRIGGERING_ACTOR_ID RUN_ACTOR RUN_TRIGGERING_ACTOR BOT_EXCLUDED; do
            printf 'canary %s=%s\n' "$k" "${!k}" | tee -a "$GITHUB_STEP_SUMMARY"
          done
