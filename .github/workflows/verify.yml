name: Verify local milestone
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
concurrency:
  group: verify-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Record allowlisted identity fields (no emails)
        env:
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          PUSHER_NAME: ${{ github.event.pusher.name }}
          SENDER_LOGIN: ${{ github.event.sender.login }}
          SENDER_ID: ${{ github.event.sender.id }}
          SENDER_TYPE: ${{ github.event.sender.type }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          HEAD_AUTHOR_USER: ${{ github.event.head_commit.author.username }}
          HEAD_COMMITTER_USER: ${{ github.event.head_commit.committer.username }}
          MG_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MG_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          MG_BASE_REF: ${{ github.event.merge_group.base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for k in EVENT ACTOR ACTOR_ID TRIGGERING_ACTOR SHA REF PUSHER_NAME SENDER_LOGIN SENDER_ID SENDER_TYPE BEFORE AFTER HEAD_AUTHOR_USER HEAD_COMMITTER_USER MG_HEAD_SHA MG_BASE_SHA MG_HEAD_REF MG_BASE_REF PR_HEAD_SHA; do
            printf 'canary %s=%s\n' "$k" "${!k}" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          printf 'canary PARENTS=%s\n' "$(git log -1 --format='%H %P' HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
